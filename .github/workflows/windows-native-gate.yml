name: Build and release

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: build-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-build-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Unit and integration tests
        run: go test ./...

      - name: JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem web/static/js -Recurse -Filter *.js |
            ForEach-Object { node --check $_.FullName }

      - name: Windows Python and Whisper installer smoke
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "bizstudio-whisper-setup"
          $env:WHISPER_MODEL = "__bizstudio_missing_model__"
          & ./internal/setup/scripts/setup-whisper.ps1 $data
          if ($LASTEXITCODE -ne 0) { throw "Whisper installer failed" }
          $python = Join-Path $data "whisper/venv/Scripts/python.exe"
          & $python -c "import faster_whisper, importlib.metadata as m; print(m.version('faster-whisper'))"
          if ($LASTEXITCODE -ne 0) { throw "Whisper venv is not importable" }

      - name: Build both Windows executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          go build -trimpath -o artifacts/bizstudio.exe ./cmd/bizstudio
          go build -trimpath -ldflags "-H windowsgui" -o "artifacts/Biz Studio.exe" ./cmd/bizstudio

      - name: Native control and mobile-listener smoke
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "bizstudio-smoke"
          $process = Start-Process -FilePath "artifacts/bizstudio.exe" `
            -ArgumentList @("-window=false", "-port", "17680", "-data", $data) -PassThru
          try {
            $state = $null
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $state = Invoke-RestMethod "http://127.0.0.1:17680/api/state"
                break
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $state) { throw "Biz Studio did not become ready" }
            if ($state.app.name -ne "Biz Studio") { throw "Unexpected instance marker" }
            $windows = Invoke-RestMethod "http://127.0.0.1:17680/api/setup/windows/status"
            if (-not $windows.supported) { throw "Windows readiness endpoint is not supported" }
            if ($windows.detail) { throw "Windows readiness probe failed: $($windows.detail)" }
            $mobile = Invoke-WebRequest `
              "http://$($state.lanIP):$($state.mobilePort)/api/setup/tools" -SkipHttpErrorCheck
            if ($mobile.StatusCode -ne 404) { throw "Mobile listener exposed control API" }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bizstudio-windows-amd64-unsigned
          path: artifacts/

  package-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test-build-smoke
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Validate release tag
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag không hợp lệ: $tag (cần dạng v2.14.0 hoặc v2.14.0-rc.1)" >&2
            exit 2
          fi
          if ! grep -Fxq "<!-- release: $tag -->" RELEASE_NOTES.md; then
            echo "RELEASE_NOTES.md chưa được cập nhật cho $tag" >&2
            exit 2
          fi
          echo "RELEASE_VERSION=${tag#v}" >> "$GITHUB_ENV"

      - name: Build release packages
        shell: bash
        run: ./scripts/build-release.sh "$RELEASE_VERSION"

      - name: Verify release checksums
        shell: bash
        run: cd dist && shasum -a 256 -c SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bizstudio-${{ github.ref_name }}-release
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bizstudio-${{ github.ref_name }}-release
          path: dist

      - name: Verify downloaded checksums
        shell: bash
        run: cd dist && sha256sum -c SHA256SUMS.txt

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" \
              --title "Biz Studio $tag" \
              --notes-file RELEASE_NOTES.md
            exit 0
          fi

          args=(
            release create "$tag" dist/*
            --verify-tag
            --title "Biz Studio $tag"
            --notes-file RELEASE_NOTES.md
          )
          if [[ "$tag" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
