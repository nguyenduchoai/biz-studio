<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<style>
{{.FontCSS}}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }

/* Biến giao diện — mặc định BẰNG ĐÚNG giá trị hard-code cũ, Style Kit chỉ ghi
   đè khi có bộ style, nên video cũ render lại vẫn y hệt. Cỡ chữ là 3 mốc gốc,
   mọi cỡ chữ khác tính theo tỉ lệ với 3 mốc này để bố cục không đổi. */
:root {
  --font-head: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --size-title: calc(var(--u) * 9.2);
  --size-big: calc(var(--u) * 8.4);
  --size-body: calc(var(--u) * 3.6);
}
body {
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}
#bg { position: fixed; left: -20%; top: -20%; width: 140%; height: 140%; z-index: 0; }
.orb { position: absolute; left: 0; top: 0; border-radius: 50%; filter: blur(60px); }

/* ---------- tư liệu nền (chạy dưới lớp chữ) ---------- */
#stockbg { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
#stockimg {
  position: absolute; left: 50%; top: 50%; width: 100%; height: 100%;
  object-fit: cover; transform-origin: 50% 50%; will-change: transform;
}
#stockveil { position: absolute; inset: 0; }

/* ---------- logo + tên kênh ---------- */
#brand {
  position: fixed; left: 0; right: 0; bottom: 3.4%; z-index: 2;
  display: flex; align-items: center; gap: calc(var(--u) * 1.8);
  padding: 0 7.5%; pointer-events: none;
}
#brand.pos-left { justify-content: flex-start; }
#brand.pos-center { justify-content: center; }
#brand.pos-right { justify-content: flex-end; }
#brandlogo {
  height: calc(var(--u) * 5.4); width: auto; max-width: 34%;
  object-fit: contain;
  filter: drop-shadow(0 calc(var(--u) * .3) calc(var(--u) * 1) rgba(0,0,0,.35));
}
#brandname {
  font-family: var(--font-body); font-weight: 700;
  font-size: calc(var(--size-body) * 2.6 / 3.6); letter-spacing: .06em;
  color: var(--fg); white-space: nowrap;
  text-shadow: 0 calc(var(--u) * .2) calc(var(--u) * .9) rgba(0,0,0,.4);
}

#stage {
  position: fixed; inset: 0; z-index: 1; padding: 8%;
  display: flex; flex-direction: column; justify-content: center;
  color: var(--fg); overflow-wrap: break-word;
}

/* ---------- themes ---------- */
body.theme-vivid {
  --fg: #FFFFFF; --muted: rgba(255,255,255,.78);
  --t1: #FFFFFF; --t2: #FFE0F3;
  --a1: #FFD166; --a2: #FF8FAB;
  --track: rgba(255,255,255,.20);
  --codebg: rgba(16,10,40,.85); --codeline: rgba(255,255,255,.14);
  background: #7C3AED;
}
body.theme-vivid #bg {
  background: linear-gradient(135deg, #7C3AED 0%, #A855F7 38%, #EC4899 100%);
  background-size: 220% 220%;
}
body.theme-dark {
  --fg: #F4F1FF; --muted: #A9A3C4;
  --t1: #A78BFA; --t2: #F472B6;
  --a1: #A78BFA; --a2: #F472B6;
  --track: rgba(255,255,255,.10);
  --codebg: #171130; --codeline: rgba(255,255,255,.10);
  background: #0E0A1F;
}
body.theme-dark #bg { background: #0E0A1F; }
body.theme-light {
  --fg: #17123A; --muted: #5B5677;
  --t1: #7C3AED; --t2: #EC4899;
  --a1: #7C3AED; --a2: #EC4899;
  --track: rgba(23,18,58,.10);
  --codebg: #1B1533; --codeline: rgba(255,255,255,.10);
  background: #F7F5FE;
}
body.theme-light #bg { background: #F7F5FE; }

/* ---------- shared ---------- */
.grad-text {
  background: linear-gradient(92deg, var(--t1), var(--t2));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  /* Chữ gradient cắt mất phần trên của dấu chồng tầng tiếng Việt (Ẫ Ể Ấ Ữ Ổ)
     vì dấu vươn ra ngoài hộp tô gradient nên không được vẽ. Đo thực tế: mất
     17px ở cỡ chữ 150px. line-height 1.0 + padding-top .5em kéo hộp tô lên
     đủ để chứa dấu; padding-bottom giữ phần chân chữ (ạ ậ ợ) không bị hụt. */
  line-height: 1.0;
  padding-top: .5em;
  padding-bottom: .14em;
}
.center {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; height: 100%; gap: calc(var(--u)*2.6);
}
.top { display: flex; flex-direction: column; justify-content: center; height: 100%; }
.badge {
  display: inline-flex; align-items: center; gap: .45em;
  font-family: var(--font-head);
  font-size: calc(var(--size-body) * 2.4 / 3.6); font-weight: 800; letter-spacing: .18em;
  padding: calc(var(--u)*1) calc(var(--u)*2.8); border-radius: 999px;
  background: linear-gradient(92deg, var(--a1), var(--a2)); color: #fff;
  box-shadow: 0 calc(var(--u)*.8) calc(var(--u)*3) rgba(0,0,0,.22);
}
.sec-title {
  font-family: var(--font-head);
  font-size: calc(var(--size-title) * 6 / 9.2); font-weight: 800; letter-spacing: -.015em;
  line-height: 1.12; margin-bottom: calc(var(--u)*4.2);
}

/* ---------- hero ---------- */
.hero-title { font-family: var(--font-head); font-size: var(--size-title); font-weight: 800; line-height: 1.06; letter-spacing: -.02em; }
.hero-sub { font-size: var(--size-body); color: var(--muted); font-weight: 500; max-width: 92%; line-height: 1.4; }

/* ---------- bullets ---------- */
.bullet {
  display: flex; align-items: flex-start; gap: calc(var(--u)*2.2);
  font-size: calc(var(--size-body) * 3.7 / 3.6); font-weight: 600; line-height: 1.35;
  margin-bottom: calc(var(--u)*3);
}
.tick {
  flex: none; width: calc(var(--size-body) * 4.6 / 3.6); height: calc(var(--size-body) * 4.6 / 3.6); border-radius: 50%;
  background: linear-gradient(135deg, var(--a1), var(--a2));
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 calc(var(--u)*.6) calc(var(--u)*2.2) rgba(0,0,0,.22);
}
/* Dấu tích, mũi tên, con trỏ và ngôi sao dưới đây VẼ BẰNG CSS chứ không dùng ký
   tự ✓ ✦ ▍ ▶. Lý do đo được: font tiếng Việt đóng gói kèm (Be Vietnam Pro) chỉ
   có 459 glyph và KHÔNG có bốn ký tự đó, nên chúng rơi sang font của hệ điều
   hành — tức lọt đúng khỏi cái mà việc đóng gói font sinh ra để tránh: hai máy
   render ra hai kiểu. Hình học CSS thì máy nào cũng ra đúng từng pixel. */
.tick::after {
  content: ''; display: block;
  width: 32%; height: 58%;
  border: solid #fff; border-width: 0 .16em .16em 0;
  transform: translateY(-8%) rotate(45deg);
}
.btext { padding-top: calc(var(--u)*.5); }

/* ---------- code ---------- */
.codewrap {
  background: var(--codebg); border: 1px solid var(--codeline);
  border-radius: calc(var(--u)*2.2); overflow: hidden;
  box-shadow: 0 calc(var(--u)*2) calc(var(--u)*6) rgba(0,0,0,.35);
}
.codebar { display: flex; gap: calc(var(--u)*1); padding: calc(var(--u)*1.6) calc(var(--u)*2); border-bottom: 1px solid var(--codeline); }
.dot { width: calc(var(--u)*1.3); height: calc(var(--u)*1.3); border-radius: 50%; }
.codebody {
  padding: calc(var(--u)*2.6); min-height: calc(var(--u)*18);
  font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  font-size: calc(var(--size-body) * 2.6 / 3.6); line-height: 1.65; color: #E9E5FF;
  white-space: pre-wrap; word-break: break-word;
}
/* Ba lớp của hiệu ứng "đang được vẽ ra". Cùng MỘT ảnh, khác bộ lọc, lần lượt
   quét ngang lộ ra: nét đen trắng trước, rồi tô bóng xám, rồi lên màu. Mắt đọc
   ra là bức tranh đang được vẽ dần, dù thật ra chỉ có một tấm ảnh. */
.dlayer { position: absolute; inset: 0; overflow: hidden; }
.dlayer > img {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  min-width: 100%; min-height: 100%; object-fit: cover;
}
.caret {
  /* tỉ lệ con trỏ khối của terminal: hẹp bằng khoảng 1/3 ô chữ, cao gần trọn
     dòng — rộng hơn thì đọc ra là ô màu chứ không phải con trỏ đang nhấp nháy */
  display: inline-block; width: .34em; height: 1.18em;
  background: var(--a2); vertical-align: -.24em; border-radius: .04em;
}

/* ---------- chart ---------- */
.rows { display: flex; flex-direction: column; gap: calc(var(--u)*3); }
.rlabel {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: calc(var(--size-body) * 2.9 / 3.6); font-weight: 600; margin-bottom: calc(var(--u)*1);
}
.rval { font-family: var(--font-head); font-weight: 800; font-size: calc(var(--size-big) * 3.1 / 8.4); }
.track { height: calc(var(--u)*3); border-radius: 999px; background: var(--track); overflow: hidden; }
.bar { height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, var(--a1), var(--a2)); }

/* ---------- product ---------- */
.pwrap { display: flex; flex-direction: column; justify-content: center; height: 100%; }
.pimgwrap {
  flex: none; height: 58%; border-radius: calc(var(--u)*3); overflow: hidden;
  box-shadow: 0 calc(var(--u)*2.4) calc(var(--u)*7) rgba(0,0,0,.35);
  margin-bottom: calc(var(--u)*3.6);
}
.pimg { width: 100%; height: 100%; object-fit: cover; transform-origin: center; }
.ptitle { font-family: var(--font-head); font-size: calc(var(--size-title) * 6.2 / 9.2); font-weight: 800; letter-spacing: -.015em; line-height: 1.12; }
.pbig { font-size: var(--size-big); }
.psub { font-size: calc(var(--size-body) * 3.2 / 3.6); color: var(--muted); font-weight: 500; margin-top: calc(var(--u)*1.6); line-height: 1.4; }

/* ---------- keys (từ khoá chính trên, từ khoá liên quan dưới) ----------

   Bố cục này dành cho video dọc đăng mạng xã hội. Hai điều quyết định vị trí:

   1) VÙNG BỊ CHE. Ứng dụng xem video phủ nút và chú thích lên 15% dưới cùng và
      12% bên phải. Chữ lọt vào đó là mất chữ, nên hai dải nội dung đều dừng
      trước ranh giới này.
   2) Hai dải nằm NGOÀI khối ảnh nền. Ảnh nền có phóng chậm; nếu để chữ chung
      khối với ảnh thì chữ trôi theo, ra khỏi vùng an toàn lúc nào không biết. */
.kbg { position: absolute; inset: 0; overflow: hidden; z-index: 0; }
.kbgimg {
  position: absolute; left: 50%; top: 50%; width: 100%; height: 100%;
  object-fit: cover; transform-origin: 50% 50%; will-change: transform;
}
.kshade {
  position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(180deg, rgba(6,4,18,.88) 0%, rgba(6,4,18,.52) 22%, rgba(6,4,18,.18) 40%,
                    rgba(6,4,18,.34) 60%, rgba(6,4,18,.80) 80%, rgba(6,4,18,.92) 100%);
}
/* dải trên: 5%–18% chiều cao — dưới notch, trên phần thân ảnh */
.kmain {
  position: absolute; left: 7%; right: 13%; top: 5%; height: 13%; z-index: 2;
  display: flex; align-items: center;
}
.kmaintext {
  font-family: var(--font-head); font-weight: 800; line-height: 1.04;
  letter-spacing: -.02em; color: var(--text-main);
  text-shadow: 0 calc(var(--u)*.3) calc(var(--u)*1.6) rgba(0,0,0,.55);
}
/* dải dưới: 67.2%–77.6% — kết thúc cách đáy 22%, thừa 7% so với vùng bị che */
.krel {
  position: absolute; left: 7%; right: 13%; top: 67.2%; height: 10.4%; z-index: 2;
  display: flex; flex-wrap: wrap; align-content: center;
  gap: calc(var(--u)*1.1) calc(var(--u)*1.3); overflow: hidden;
}
.kchip {
  padding: calc(var(--u)*.9) calc(var(--u)*2); border-radius: 999px;
  font-family: var(--font-body); font-weight: 700;
  font-size: calc(var(--size-body) * 3.0 / 3.6); line-height: 1.1;
  color: var(--text-main); background: rgba(255,255,255,.12);
  border: 1px solid rgba(255,255,255,.22); backdrop-filter: blur(6px);
  white-space: nowrap;
}
/* khung nhắc vùng bị che — chỉ bật khi xem thử, không bao giờ vào video */
.ksafe { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
.ksafe i {
  position: absolute; background: rgba(244,63,94,.14);
  outline: 2px dashed rgba(244,63,94,.75); outline-offset: -2px;
}
.ksafe .sb { left: 0; right: 0; bottom: 0; height: 15%; }
.ksafe .sr { top: 0; bottom: 0; right: 0; width: 12%; }

/* ---------- photo (ảnh tràn khung, chữ đè 1/3 dưới) ---------- */
.phwrap { position: absolute; inset: 0; overflow: hidden; }
.phimg {
  position: absolute; left: 50%; top: 50%; width: 100%; height: 100%;
  object-fit: cover; transform-origin: 50% 50%; will-change: transform;
}
.phshade {
  position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(180deg, rgba(6,4,18,.46) 0%, rgba(6,4,18,.06) 22%, rgba(6,4,18,0) 38%,
                    rgba(6,4,18,.42) 62%, rgba(6,4,18,.80) 82%, rgba(6,4,18,.94) 100%);
}
.phtext {
  position: absolute; left: 7.5%; right: 7.5%; bottom: 13%;
  display: flex; flex-direction: column; align-items: flex-start;
}
.phbar {
  height: calc(var(--u)*.8); width: calc(var(--u)*11); border-radius: 999px;
  background: linear-gradient(92deg, var(--a1), var(--a2));
  margin-bottom: calc(var(--u)*2.6);
  box-shadow: 0 calc(var(--u)*.4) calc(var(--u)*1.6) rgba(0,0,0,.45);
}
.phtitle {
  font-family: var(--font-head);
  color: #fff; font-weight: 800; letter-spacing: -.012em; line-height: 1.26;
  overflow: hidden; overflow-wrap: break-word;
  text-shadow: 0 calc(var(--u)*.32) calc(var(--u)*1.5) rgba(0,0,0,.66),
               0 calc(var(--u)*.08) calc(var(--u)*.5) rgba(0,0,0,.55);
}

/* ---------- quote ---------- */
.qmark { font-family: Georgia, "Times New Roman", serif; font-size: calc(var(--size-big) * 24 / 8.4); line-height: .55; font-weight: 800; }
.qtext { font-family: var(--font-head); font-size: calc(var(--size-title) * 5.2 / 9.2); font-weight: 600; font-style: italic; line-height: 1.35; letter-spacing: -.01em; max-width: 94%; }
.qauthor { font-size: calc(var(--size-body) * 3 / 3.6); color: var(--muted); font-weight: 600; }

/* ---------- outro ---------- */
.pulse { position: relative; width: calc(var(--u)*16); height: calc(var(--u)*16); margin-bottom: calc(var(--u)*2); }
.ring { position: absolute; inset: 0; border-radius: 50%; border: calc(var(--u)*.5) solid var(--a2); }
.core {
  position: absolute; inset: 22%; border-radius: 50%;
  background: linear-gradient(135deg, var(--a1), var(--a2));
  display: flex; align-items: center; justify-content: center;
}
/* tam giác "play" bằng viền: lệch phải một chút cho cân thị giác trong hình tròn */
.core::after {
  content: ''; display: block;
  border-style: solid; border-width: calc(var(--u)*2.3) 0 calc(var(--u)*2.3) calc(var(--u)*3.9);
  border-color: transparent transparent transparent #fff;
  margin-left: calc(var(--u)*.9);
}
/* ngôi sao bốn cánh — clip-path lõm cạnh cho ra dáng lấp lánh */
.spark {
  display: inline-block; width: 1em; height: 1em; background: #fff;
  clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%);
}
.otitle { font-family: var(--font-head); font-size: calc(var(--size-title) * 7.6 / 9.2); font-weight: 800; letter-spacing: -.02em; line-height: 1.1; max-width: 96%; }
.osub { font-size: calc(var(--size-body) * 3.4 / 3.6); color: var(--muted); font-weight: 600; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="stockbg" style="display:none"><img id="stockimg" alt=""><div id="stockveil"></div></div>
<div id="stage"></div>
<div id="brand" style="display:none"><img id="brandlogo" alt=""><span id="brandname"></span></div>
<script>
var DATA = {{.DataJSON}};
(function () {
  'use strict';
  var D = DATA, W = D.w, H = D.h, DUR = D.dur;
  var K = D.kit || null;
  var u = Math.min(W, H) / 100;
  document.documentElement.style.setProperty('--u', u + 'px');
  document.body.className = 'theme-' + D.theme;

  var REVEAL = D.reveal || 'none';

  /* template hiệu lực: cảnh photo mà chưa có ảnh thì rơi về hero */
  var TPL = D.template === 'photo' && !D.image ? 'hero' : D.template;

  /* ---------- helpers: mọi trạng thái là hàm thuần của t ---------- */
  function clamp01(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }
  function easeOutCubic(x) { x = clamp01(x); return 1 - Math.pow(1 - x, 3); }

  /* Ba đường cong cho ba loại "sức nặng" khác nhau. Trước đây mọi thứ dùng
     chung easeOutCubic nên cả khung hình chuyển động cùng một cảm giác — chữ
     to nặng và cái huy hiệu nhỏ về đích y như nhau, mắt đọc ra là đồ hoạ chứ
     không phải vật thể.
       cubic — mặc định, dùng cho phần lớn phần tử
       expo  — hãm rất gắt ở cuối: phần tử "ĐÁP xuống" chứ không "dừng lại",
               dành cho thứ nặng nhất khung hình (tiêu đề)
       back  — vọt quá đích một chút rồi lùi về, cho thứ nhỏ và nảy (huy hiệu,
               con số) — biên độ để rất nhẹ (1.34) vì quá tay thành hoạt hình */
  function easeOutExpo(x) { x = clamp01(x); return x >= 1 ? 1 : 1 - Math.pow(2, -10 * x); }
  /* smoothstep: mềm cả hai đầu. Dùng cho nét vẽ quét ra — vào và ra đều êm,
     khác easeOut (vào gắt, ra êm) vốn hợp với vật rơi xuống. */
  function smoothstep(x) { x = clamp01(x); return x * x * (3 - 2 * x); }
  function easeOutBack(x) {
    x = clamp01(x);
    var c = 1.34, y = x - 1;
    return 1 + (c + 1) * y * y * y + c * y * y;
  }
  function seg(t, start, dur) { return easeOutCubic((t - start) / dur); }
  function segExpo(t, start, dur) { return easeOutExpo((t - start) / dur); }
  function segBack(t, start, dur) { return easeOutBack((t - start) / dur); }

  /* Luật một khung tối đa ba phần tử đang "sáng": phần tử mới vào thì phần tử
     cũ phải lùi lại (mờ đi + thụt nhẹ), không phải biến mất. Không có luật này
     thì cảnh 6 gạch đầu dòng có khung cuối 7 thứ cùng hét lên một lúc, mắt
     không biết nhìn đâu.
     recede(i, cur) trả độ mờ của mục thứ i khi mục cur đang là mục mới nhất. */
  var ACTIVE_MAX = 3;
  function recede(i, cur) {
    var back = cur - i;                    // mục này đã vào trước bao nhiêu lượt
    if (back < ACTIVE_MAX) return 1;       // vẫn trong nhóm đang sáng
    return 0.42;                           // đã lùi về sau: còn đọc được, hết giành nhìn
  }
  function rnd(i) { var x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
  function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt !== undefined && txt !== null) e.textContent = txt;
    return e;
  }
  function fx(e, op, tx, ty, extra) {
    if (!e) return;
    e.style.opacity = op;
    e.style.transform = 'translate(' + tx + 'px,' + ty + 'px)' + (extra || '');
  }
  function fmtVal(v, allInt) {
    if (allInt) return Math.round(v).toLocaleString('vi-VN');
    return (Math.round(v * 10) / 10).toLocaleString('vi-VN', { maximumFractionDigits: 1 });
  }

  /* ---------- màu: đọc mã hex của bộ style ---------- */
  function hex2rgb(h) {
    if (typeof h !== 'string') return null;
    var s = h.trim().replace('#', '');
    if (s.length === 3) s = s[0] + s[0] + s[1] + s[1] + s[2] + s[2];
    if (!/^[0-9a-fA-F]{6}$/.test(s)) return null;
    return [parseInt(s.slice(0, 2), 16), parseInt(s.slice(2, 4), 16), parseInt(s.slice(4, 6), 16)];
  }
  function rgba(h, a) {
    var c = hex2rgb(h);
    return c ? 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')' : h;

    var a = hex2rgb(h1), b = hex2rgb(h2);
    if (!a || !b) return h1;
    return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * k) + ',' +
      Math.round(a[1] + (b[1] - a[1]) * k) + ',' +
      Math.round(a[2] + (b[2] - a[2]) * k) + ')';
  }

  /* ---------- bộ style: font, cỡ chữ, 3 biến màu ---------- */
  var ACC = (K && K.accent) || '', ACC2 = (K && K.accent2) || ACC;
  var TS = K && K.rTitle > 0 ? K.rTitle : 1;
  (function applyKit() {
    if (!K) return;
    var root = document.documentElement.style, b = document.body.style;
    if (K.fontHead) root.setProperty('--font-head', K.fontHead);
    if (K.fontBody) root.setProperty('--font-body', K.fontBody);
    root.setProperty('--size-title', (u * 9.2 * TS) + 'px');
    root.setProperty('--size-big', (u * 8.4 * (K.rBig > 0 ? K.rBig : 1)) + 'px');
    root.setProperty('--size-body', (u * 3.6 * (K.rBody > 0 ? K.rBody : 1)) + 'px');
    if (K.textMain) {
      b.setProperty('--fg', K.textMain);
      b.setProperty('--muted', rgba(K.textMain, .74));
      b.setProperty('--t1', K.textMain);
      b.setProperty('--track', rgba(K.textMain, .18));
      b.setProperty('--codeline', rgba(K.textMain, .16));

    if (ACC) {

    if (K.bgDeep) {

  })();

  /* accent riêng của cảnh vẫn thắng bộ style (override có chủ đích);
     không có bộ style thì giữ NGUYÊN cách xử lý cũ */
  if (D.accent) {

  /* ---------- nền: gradient + hạt glow trôi theo t ---------- */
  var bgEl = document.getElementById('bg');
  var orbs = [];
  (function buildBg() {
    var cols;
    if (K) {
      /* nền lấy từ bộ style: gradient màu nền chính → pha màu nhấn, hạt glow
         lấy từ bảng màu để cả khung hình cùng một tông */
      if (K.bgDeep) {
        bgEl.style.background = 'linear-gradient(135deg, ' + K.bgDeep + ' 0%, ' +
          mix(K.bgDeep, ACC || K.bgDeep, .34) + ' 100%)';
        bgEl.style.backgroundSize = '220% 220%';
      }
      cols = [];
      (K.palette || []).forEach(function (c) { if (hex2rgb(c)) cols.push(rgba(c, .40)); });
      if (!cols.length) cols = [rgba(ACC, .42), rgba(ACC2, .34), rgba(K.textMain, .12), rgba(ACC, .28)];
    } else if (D.theme === 'light') {
      cols = ['rgba(196,181,253,.75)', 'rgba(249,168,212,.70)', 'rgba(167,243,208,.50)', 'rgba(196,181,253,.60)'];
    } else if (D.theme === 'dark') {
      cols = ['rgba(124,58,237,.50)', 'rgba(236,72,153,.42)', 'rgba(59,130,246,.30)', 'rgba(124,58,237,.40)'];
    } else {
      cols = ['rgba(255,255,255,.55)', 'rgba(255,158,210,.60)', 'rgba(255,209,102,.50)', 'rgba(167,139,250,.55)'];
    }
    for (var i = 0; i < 4; i++) {
      var o = el('div', 'orb');
      var s = Math.min(W, H) * (0.38 + 0.16 * rnd(i));
      o.style.width = s + 'px';
      o.style.height = s + 'px';
      o.style.background = 'radial-gradient(circle at 40% 40%, ' + cols[i % cols.length] + ', transparent 70%)';
      bgEl.appendChild(o);
      orbs.push({
        e: o, s: s,
        bx: (0.06 + 0.85 * rnd(i + 7)) * W * 1.4,
        by: (0.06 + 0.85 * rnd(i + 13)) * H * 1.4,
        sp: 0.25 + 0.3 * rnd(i + 3),
        ph: rnd(i + 5) * 6.283,
        ax: W * 0.05, ay: H * 0.04
      });
    }
  })();
  function bgUpdate(t) {
    if (D.theme === 'vivid' || (K && K.bgDeep)) {
      bgEl.style.backgroundPosition =
        (20 + 14 * Math.sin(t * 0.35)) + '% ' + (50 + 14 * Math.cos(t * 0.27)) + '%';
    }
    for (var i = 0; i < orbs.length; i++) {
      var o = orbs[i];
      var x = o.bx + Math.sin(t * o.sp + o.ph) * o.ax - o.s / 2;
      var y = o.by + Math.cos(t * o.sp * 0.8 + o.ph) * o.ay - o.s / 2;
      o.e.style.transform = 'translate(' + x + 'px,' + y + 'px)';
    }
  }

  /* ---------- tư liệu nền: chỉ cho template KHÔNG có ảnh riêng ----------
     Dùng khung hình tĩnh (video đã được ffmpeg trích sẵn 1 khung đại diện) và
     zoom theo t — nhờ vậy nền vẫn tất định, mọi frame tính lại y hệt. */
  var stockOwn = { hero: 1, bullets: 1, quote: 1, outro: 1 };
  var stockUpdate = null;
  (function buildStock() {
    if (!D.stock || !stockOwn[TPL]) return;
    var wrap = document.getElementById('stockbg');
    var img = document.getElementById('stockimg');
    var veil = document.getElementById('stockveil');
    img.src = D.stock;
    var base = (K && K.bgDeep) || '#06040F';
    veil.style.background = 'linear-gradient(180deg, ' + rgba(base, .58) + ' 0%, ' +
      rgba(base, .70) + ' 45%, ' + rgba(base, .88) + ' 100%)';
    wrap.style.display = '';
    stockUpdate = function (t) {
      var p = clamp01(DUR > 0 ? t / DUR : 0);
      img.style.opacity = 0.55 + 0.45 * seg(t, 0, 0.7);
      var d = drift(p, 2.6);
      img.style.transform = 'translate(calc(-50% + ' + d[0] + 'px), calc(-50% + ' + d[1] +
        'px)) scale(' + (1 + 0.05 * p) + ')';
    };
  })();

  /* ---------- logo + tên kênh ---------- */
  var brandUpdate = null;
  (function buildBrand() {
    if (!K) return;
    var name = K.channelName || '', logo = D.logo || '';
    if (!name && !logo) return;
    var wrap = document.getElementById('brand');
    var img = document.getElementById('brandlogo');
    var txt = document.getElementById('brandname');
    if (logo) { img.src = logo; } else { img.style.display = 'none'; }
    if (name) { txt.textContent = name; } else { txt.style.display = 'none'; }
    wrap.className = 'pos-' + (K.logoPos || 'left');
    wrap.style.display = '';
    brandUpdate = function (t) { wrap.style.opacity = 0.85 * seg(t, 0.25, 0.6); };
  })();

  /* ---------- template builders: trả về update(t) ---------- */
  var stage = document.getElementById('stage');

  function buildHero() {
    var c = el('div', 'center');
    var badge = el('div', 'badge');
    badge.appendChild(el('span', 'spark'));
    var title = el('h1', 'hero-title grad-text', D.title || '');
    var sub = D.subtitle ? el('p', 'hero-sub', D.subtitle) : null;
    c.appendChild(badge); c.appendChild(title);
    if (sub) c.appendChild(sub);
    stage.appendChild(c);
    return function (t) {
      var eb = segBack(t, 0, 0.45); fx(badge, clamp01(eb), 0, (1 - eb) * -24);
      var e1 = segExpo(t, 0, 0.8); fx(title, e1, 0, (1 - e1) * 60);
      var e2 = seg(t, 0.4, 0.8); fx(sub, e2, 0, (1 - e2) * 40);
    };
  }

  function buildBullets() {
    var c = el('div', 'top');
    var title = el('h2', 'sec-title grad-text', D.title || '');
    c.appendChild(title);
    var items = [];
    (D.bullets || []).forEach(function (txt) {
      var row = el('div', 'bullet');
      row.appendChild(el('div', 'tick'));
      row.appendChild(el('div', 'btext', txt));
      c.appendChild(row);
      items.push(row);
    });
    stage.appendChild(c);
    /* Nhịp co lại cho vừa cảnh: 0.35s/mục là đẹp với cảnh 5 giây, nhưng video
       15 giây chia 6 cảnh thì mỗi cảnh 2.5s — giữ nguyên nhịp là mục cuối chưa
       kịp hiện đã hết cảnh. Chừa 0.9s cuối để khung chốt đứng yên cho người
       xem đọc (tài liệu gọi là "礼让": nhường mắt người xem). */
    var START = 0.45, IN = 0.55;
    var room = Math.max(0.6, DUR - START - IN - 0.9);
    var STEP = items.length > 1 ? Math.min(0.35, room / (items.length - 1)) : 0.35;
    return function (t) {
      var e0 = segExpo(t, 0, 0.5); fx(title, e0, 0, (1 - e0) * 30);
      // mục mới nhất đã vào tới đâu — để biết mục nào phải lùi lại
      var cur = -1;
      for (var j = 0; j < items.length; j++) if (t >= START + j * STEP) cur = j;
      for (var i = 0; i < items.length; i++) {
        var e = seg(t, START + i * STEP, IN);
        var dim = e * recede(i, cur);
        // lùi lại = mờ đi VÀ thụt vào một chút: chỉ mờ thôi mắt vẫn thấy ngang hàng
        fx(items[i], dim, (1 - e) * -46, 0, dim < 1 ? ' scale(0.972)' : '');
      }
    };
  }

  function buildCode() {
    var c = el('div', 'top');
    var title = null;
    if (D.title) { title = el('h2', 'sec-title grad-text', D.title); c.appendChild(title); }
    var wrap = el('div', 'codewrap');
    var barEl = el('div', 'codebar');
    ['#FF5F57', '#FEBC2E', '#28C840'].forEach(function (col) {
      var d = el('span', 'dot'); d.style.background = col; barEl.appendChild(d);
    });
    var body = el('pre', 'codebody');
    var codeSpan = el('span', '', '');
    var caret = el('span', 'caret');
    body.appendChild(codeSpan); body.appendChild(caret);
    wrap.appendChild(barEl); wrap.appendChild(body);
    c.appendChild(wrap); stage.appendChild(c);
    var chars = D.code ? Array.from(D.code) : [];
    var typeStart = 0.35;
    var typeDur = Math.min(Math.max(DUR - 1.4, 0.8), Math.max(chars.length * 0.045, 0.8));
    return function (t) {
      if (title) { var e0 = seg(t, 0, 0.5); fx(title, e0, 0, (1 - e0) * 30); }
      var ew = seg(t, 0.1, 0.6); fx(wrap, ew, 0, (1 - ew) * 40);
      var n = Math.floor(clamp01((t - typeStart) / typeDur) * chars.length);
      codeSpan.textContent = chars.slice(0, n).join('');
      var blink = n < chars.length ? (Math.floor(t * 3) % 2 === 0) : (Math.floor(t * 1.4) % 2 === 0);
      caret.style.opacity = blink ? 1 : 0;
    };
  }

  function buildChart() {
    var c = el('div', 'top');
    var title = el('h2', 'sec-title grad-text', D.title || '');
    c.appendChild(title);
    var rowsEl = el('div', 'rows');
    var data = D.chart || [];
    var maxV = 0, allInt = true;
    data.forEach(function (it) {
      var v = Number(it.value) || 0;
      if (v > maxV) maxV = v;
      if (Math.abs(v - Math.round(v)) > 1e-9) allInt = false;
    });
    if (maxV <= 0) maxV = 1;
    var rows = [];
    data.forEach(function (it) {
      var row = el('div', 'row');
      var lab = el('div', 'rlabel');
      lab.appendChild(el('span', '', it.label || ''));
      var val = el('span', 'rval', '0');
      lab.appendChild(val);
      var track = el('div', 'track');
      var bar = el('div', 'bar');
      track.appendChild(bar);
      row.appendChild(lab); row.appendChild(track);
      rowsEl.appendChild(row);
      rows.push({ row: row, bar: bar, val: val, v: Number(it.value) || 0 });
    });
    c.appendChild(rowsEl); stage.appendChild(c);
    /* Nhãn hiện xong thì DỪNG một nhịp rồi con số mới chạy. Con số là thứ người
       xem phải nhớ; cho nó chạy ngay lúc nhãn còn đang bay vào thì mắt chưa kịp
       biết đang đọc chỉ số gì đã phải đuổi theo số. 0.30s là mức tối thiểu để
       não kịp phản ứng — dưới ngưỡng đó coi như không có khoảng dừng. */
    var PAUSE = 0.30, R_IN = 0.4, COUNT = 0.9, R_START = 0.2;
    /* Chừa ≥0.8s cuối cảnh cho con số ĐỨNG YÊN. Số vừa chốt đã cắt sang cảnh
       khác thì coi như chưa hề hiện ra — người xem không kịp đọc con số, mà
       con số chính là thứ duy nhất cảnh này tồn tại để nói. */
    var HOLD = 0.8;
    var need = R_START + (rows.length - 1) * 0.22 + R_IN + PAUSE + COUNT + HOLD;
    var k = need > DUR && need > 0 ? Math.max(0.35, (DUR - HOLD) / (need - HOLD)) : 1;
    var STEP = 0.22 * k, IN = R_IN * k, PZ = PAUSE * k, CNT = COUNT * k, S0 = R_START * k;
    return function (t) {
      var e0 = segExpo(t, 0, 0.5); fx(title, e0, 0, (1 - e0) * 30);
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        var at = S0 + i * STEP;
        var ein = seg(t, at, IN); fx(r.row, ein, (1 - ein) * -30, 0);
        var e = seg(t, at + IN + PZ, CNT);
        r.bar.style.width = (r.v / maxV * 100 * e) + '%';
        r.val.textContent = fmtVal(r.v * e, allInt);
      }
    };
  }

  function buildProduct() {
    var hasImg = !!D.image;
    var c = el('div', hasImg ? 'pwrap' : 'center');

    if (hasImg) {
      iw = el('div', 'pimgwrap');

    var title = el('div', hasImg ? 'ptitle' : 'ptitle pbig grad-text', D.title || '');
    var sub = D.subtitle ? el('div', 'psub', D.subtitle) : null;
    c.appendChild(title);
    if (sub) c.appendChild(sub);
    stage.appendChild(c);
    return function (t) {
      if (iw) {
        iw.style.opacity = seg(t, 0, 0.6);

      }

  /* photo: ảnh tràn khung, zoom rất nhẹ theo t, chữ trắng đè ở 1/3 dưới.
     Cỡ chữ tự co theo độ dài và bị chặn tối đa 3 dòng (đo một lần lúc dựng
     trang, không phụ thuộc t nên mọi frame đều nhất quán). */
  /* buildDrawLayers dựng ba lớp vẽ chồng lên nhau, trả hàm cập nhật theo t.
     REVEAL !== 'draw' thì trả null và cảnh chạy y hệt như trước. */
  function buildDrawLayers(host, src) {
    if (REVEAL !== 'draw') return null;
    // Ba bước xử lý: tăng tương phản mạnh + bỏ màu ra nét vẽ; tương phản vừa ra
    // lớp tô bóng; gần như nguyên bản ra lớp màu.
    // Mốc tính theo TIẾN ĐỘ cảnh (0..1). Lớp màu xong ở 0.78 chứ không phải 1.0:
    // tranh tô xong đúng lúc cắt cảnh thì coi như người xem chưa hề thấy bức
    // tranh hoàn chỉnh — chừa 22% cuối cảnh cho nó đứng yên.
    var STEPS = [
      { f: 'grayscale(1) contrast(1.75) brightness(1.14)', at: 0.00, dur: 0.34 },
      { f: 'grayscale(1) contrast(1.26) brightness(1.05)', at: 0.22, dur: 0.32 },
      { f: 'brightness(1.03) contrast(1.03)', at: 0.44, dur: 0.34 }
    ];
    var layers = STEPS.map(function (st, i) {
      var d = el('div', 'dlayer');
      d.style.zIndex = String(2 + i);
      var im = document.createElement('img');
      im.src = src;
      im.style.filter = st.f;
      d.appendChild(im);
      host.appendChild(d);
      return d;
    });
    return function (t) {
      var p = clamp01(DUR > 0 ? t / DUR : 0);
      for (var i = 0; i < layers.length; i++) {
        var st = STEPS[i];
        // Quét theo TIẾN ĐỘ CẢNH chứ không theo giây tuyệt đối: cảnh 2 giây hay
        // 8 giây thì nét vẫn vẽ xong đúng lúc, không cảnh nào vẽ dở dang.
        var q = smoothstep(clamp01((p - st.at) / st.dur));
        // Mọi lớp quét CÙNG một chiều trái→phải. Đổi chiều giữa chừng thì mắt
        // đọc ra là ảnh bị lật chứ không phải nét đang được vẽ tiếp.
        layers[i].style.clipPath = 'inset(0 ' + ((1 - q) * 100).toFixed(2) + '% 0 0)';
      }
    };
  }

  function buildPhoto() {
    if (!D.image) return buildHero(); // chưa có ảnh → vẫn ra cảnh tử tế
    var wrap = el('div', 'phwrap');
    var img = document.createElement('img');
    img.className = 'phimg';
    img.src = D.image;
    var draw = buildDrawLayers(wrap, D.image);
    var shade = el('div', 'phshade');
    var box = el('div', 'phtext');
    var bar = el('div', 'phbar');
    var title = el('div', 'phtitle', D.title || '');
    box.appendChild(bar); box.appendChild(title);
    wrap.appendChild(img); wrap.appendChild(shade); wrap.appendChild(box);
    stage.appendChild(wrap);

    var lineH = 1.26, maxLines = 3;
    var boxW = W * 0.85;
    var n = Math.max((D.title || '').length, 1);
    // ước lượng bề rộng trung bình 1 ký tự ≈ 0.52 lần cỡ chữ → cỡ vừa 3 dòng
    var px = Math.max(Math.min(maxLines * boxW / (0.52 * n), u * 6.8 * TS), u * 3.2 * TS);
    title.style.fontSize = px + 'px';
    for (var g = 0; g < 14 && px > u * 2.6; g++) {
      if (title.getBoundingClientRect().height <= px * lineH * maxLines + 2) break;
      px *= 0.93;
      title.style.fontSize = px + 'px';
    }
    title.style.maxHeight = (px * lineH * maxLines) + 'px'; // chặn cứng 3 dòng

    return function (t) {
      var p = clamp01(DUR > 0 ? t / DUR : 0);
      var e0 = seg(t, 0, 0.5);
      if (draw) {
        // Ẩn HẲN lớp gốc. Để nó mờ mờ phía dưới thì vùng chưa vẽ vẫn hiện bóng
        // của bức tranh — hé trước nội dung, và mắt đọc ra là ảnh đang rõ dần
        // chứ không phải nét đang được vẽ ra trên giấy trắng.
        img.style.opacity = 0;
        draw(t);
      } else {
        img.style.opacity = 0.35 + 0.65 * e0;
      }
      var dph = drift(p, 3.0);
      img.style.transform = 'translate(calc(-50% + ' + dph[0] + 'px), calc(-50% + ' + dph[1] +
        'px)) scale(' + (1 + 0.06 * p) + ') translateY(' + (-0.6 * p) + '%)';
      shade.style.opacity = 0.72 + 0.28 * e0;
      var e1 = seg(t, 0.22, 0.75); fx(box, e1, 0, (1 - e1) * 40);
      bar.style.transform = 'scaleX(' + (0.2 + 0.8 * seg(t, 0.32, 0.7)) + ')';
      bar.style.transformOrigin = 'left center';
    };
  }

  /* keys: từ khoá chính ở dải trên, từ khoá liên quan ở dải dưới.
     title = từ khoá chính, bullets = các từ khoá liên quan. */
  function buildKeys() {
    var bg = el('div', 'kbg');
    if (D.image) {
      var img = document.createElement('img');
      img.className = 'kbgimg';
      img.src = D.image;
      bg.appendChild(img);
    }
    bg.appendChild(el('div', 'kshade'));
    stage.appendChild(bg);

    var main = el('div', 'kmain');
    var mainText = el('div', 'kmaintext', D.title || '');
    main.appendChild(mainText);
    stage.appendChild(main);

    var rel = el('div', 'krel');
    var chips = (D.bullets || []).slice(0, 6).map(function (b) {
      var c = el('div', 'kchip', String(b));
      rel.appendChild(c);
      return c;
    });
    stage.appendChild(rel);

    if (D.safeGuides) {
      var g = el('div', 'ksafe');
      g.appendChild(el('i', 'sb')); g.appendChild(el('i', 'sr'));
      stage.appendChild(g);
    }

    /* Co chữ cho vừa ĐÚNG dải trên. Không co thì tiêu đề dài tràn xuống thân
       ảnh, phá luôn ý nghĩa của việc chia dải. */
    var bandH = main.getBoundingClientRect().height;
    var px = u * 7.2 * TS;
    mainText.style.fontSize = px + 'px';
    for (var i = 0; i < 18 && px > u * 2.4; i++) {
      var r = mainText.getBoundingClientRect();
      if (r.height <= bandH && r.width <= main.getBoundingClientRect().width) break;
      px *= 0.92;
      mainText.style.fontSize = px + 'px';
    }

    return function (t) {
      var p = clamp01(DUR > 0 ? t / DUR : 0);
      if (img) {
        var dk = drift(p, 2.8);
        img.style.transform = 'translate(calc(-50% + ' + dk[0] + 'px), calc(-50% + ' + dk[1] +
          'px)) scale(' + (1.04 + 0.07 * p) + ')';
        img.style.opacity = 0.4 + 0.6 * seg(t, 0, 0.5);
      }
      var e0 = seg(t, 0.05, 0.6);
      fx(mainText, e0, 0, (1 - e0) * -26);
      for (var i = 0; i < chips.length; i++) {
        var e = seg(t, 0.45 + i * 0.09, 0.5);
        fx(chips[i], e, 0, (1 - e) * 22);
      }
    };
  }

  function buildQuote() {
    var c = el('div', 'center');
    var mark = el('div', 'qmark', '“');
    var txt = el('div', 'qtext', D.title || '');
    var author = D.subtitle ? el('div', 'qauthor', '— ' + D.subtitle) : null;
    c.appendChild(mark); c.appendChild(txt);
    if (author) c.appendChild(author);
    stage.appendChild(c);
    return function (t) {
      mark.style.opacity = 0.16 * seg(t, 0, 0.8);
      var e1 = seg(t, 0.15, 1.0);
      txt.style.opacity = e1;
      txt.style.transform = 'translateY(' + ((1 - e1) * 34) + 'px) rotate(-1.2deg)';
      var e2 = seg(t, 0.7, 0.8); fx(author, e2, 0, (1 - e2) * 20);
    };
  }

  function buildOutro() {
    var c = el('div', 'center');
    var pulse = el('div', 'pulse');
    var ring1 = el('div', 'ring');
    var ring2 = el('div', 'ring');
    var core = el('div', 'core');
    pulse.appendChild(ring1); pulse.appendChild(ring2); pulse.appendChild(core);
    var title = el('div', 'otitle grad-text', D.title || '');
    var sub = D.subtitle ? el('div', 'osub', D.subtitle) : null;
    c.appendChild(pulse); c.appendChild(title);
    if (sub) c.appendChild(sub);
    stage.appendChild(c);
    return function (t) {
      var w1 = Math.sin(t * Math.PI * 1.6);
      ring1.style.transform = 'scale(' + (1 + 0.10 * w1) + ')';
      ring1.style.opacity = 0.55 + 0.3 * w1;
      var w2 = Math.sin(t * Math.PI * 1.6 - 1.2);
      ring2.style.transform = 'scale(' + (1.18 + 0.14 * w2) + ')';
      ring2.style.opacity = 0.3 + 0.2 * w2;
      core.style.opacity = seg(t, 0, 0.6);
      var e1 = seg(t, 0.15, 0.7);
      title.style.opacity = e1;
      title.style.transform = 'translateY(' + ((1 - e1) * 40) + 'px) scale(' + (0.92 + 0.08 * e1) + ')';
      var e2 = seg(t, 0.5, 0.7); fx(sub, e2, 0, (1 - e2) * 26);
    };
  }

  var builders = {
    hero: buildHero, bullets: buildBullets, code: buildCode, chart: buildChart,
    product: buildProduct, photo: buildPhoto, quote: buildQuote, outro: buildOutro,
    keys: buildKeys
  };
  var update = (builders[TPL] || buildHero)();

  /* ---------- chuyển cảnh & chuyển động điện ảnh ----------

     Chuyển cảnh KHÔNG dùng kiểu chồng mờ hai clip (xfade): mỗi mối nối như vậy
     ăn mất một khúc thời lượng, video ngắn lại và hình lệch dần khỏi giọng đọc
     đã thu. Ở đây mọi hiệu ứng nằm gọn TRONG thời lượng của chính cảnh, nên
     tổng thời lượng không đổi một phần nghìn giây nào.

     Cả hai đều phải bật rõ ràng; để trống thì cảnh render y hệt như trước. */
  var TRANS = D.transition || 'none';
  var MOTION = D.motion || 'basic';
  var IDX = D.index || 0;

  var transUpdate = null;

  /* Lật trang: trang hiện tại bị một đường CONG quét từ phải sang trái, kèm
     một dải "mép gấp" có gradient giả chỗ giấy cuộn lên. Đường cong chứ không
     phải đường thẳng — thẳng thì đọc ra là cái gạt nước, cong mới ra tờ giấy
     đang bị nhấc lên. Mép trên chạy trước mép dưới một nhịp vì tay lật giấy
     bao giờ cũng nhấc góc trên trước.

     Cùng luật với fade/dip: hiệu ứng nằm TRỌN trong thời lượng cảnh, không ăn
     lẹm sang cảnh sau, nên tổng thời lượng video không đổi một phần nghìn giây
     và hình không lệch dần khỏi giọng đọc đã thu. */
  /* pageBg — màu "trang giấy" phía dưới. Lấy từ bộ style nếu có, không thì
     theo theme: nền sáng ra giấy trắng, nền tối ra giấy tối. */
  function pageBg() {
    if (K && K.bgDeep) return mix(K.bgDeep, '#ffffff', 0.10);
    return D.theme === 'light' ? '#F6F4EF' : '#141024';
  }

  (function buildPageFlip() {
    if (TRANS !== 'page') return;
    var FLIP = Math.min(0.62, DUR * 0.3);   // giây dành cho cú lật ở cuối cảnh
    if (FLIP <= 0.05) return;               // cảnh quá ngắn thì bỏ, đừng lật vội vàng

    /* Dựng SVG bằng innerHTML chứ không createElementNS: hàm đó bắt buộc truyền
       chuỗi namespace "http://www.w3.org/2000/svg", mà trang cảnh có luật cứng
       là KHÔNG được chứa địa chỉ mạng nào — render phải chạy được cả khi máy
       rút mạng. Trình phân tích HTML tự gán namespace cho thẻ svg nội tuyến. */
    var host = el('div', null);
    host.style.cssText = 'position:fixed;inset:0;z-index:10;pointer-events:none';
    host.innerHTML =
      '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" ' +
      'style="width:100%;height:100%;display:block">' +
      '<defs><linearGradient id="foldg" x1="0" x2="1">' +
      '<stop offset="0" stop-color="#000" stop-opacity=".30"/>' +
      '<stop offset=".45" stop-color="#fff" stop-opacity=".20"/>' +
      '<stop offset="1" stop-color="#000" stop-opacity=".34"/>' +
      '</linearGradient></defs>' +
      // Vùng đã lật qua phải ĐỤC HẲN và mang màu nền của chính trang: để nó
      // trong mờ thì vẫn nhìn xuyên thấy trang cũ, mắt đọc ra là ảnh mờ đi chứ
      // không phải tờ giấy đã bị lật đi. Dùng màu trang chứ không dùng đen:
      // lật xong phải thấy "trang tiếp theo", không phải một hố đen.
      '<path class="pf-behind" fill="' + pageBg() + '"/>' +
      '<path class="pf-fold" fill="url(#foldg)"/>' +
      '<path class="pf-edge" fill="none" stroke="rgba(0,0,0,.28)" stroke-width="2"/>' +
      '</svg>';
    document.body.appendChild(host);
    var svg = host.firstChild;
    var behind = host.querySelector('.pf-behind');
    var fold = host.querySelector('.pf-fold');
    var edge = host.querySelector('.pf-edge');

    /* Đầu cảnh sau phải bắt đầu từ ĐÚNG màu mà cảnh trước kết thúc, nếu không
       mối nối loé lên một nhịp. Cảnh trước lật xong là cả khung màu trang, nên
       cảnh sau hiện ra từ chính màu đó. */
    var veil = el('div', null);
    veil.style.cssText = 'position:fixed;inset:0;z-index:11;pointer-events:none;background:' + pageBg();
    document.body.appendChild(veil);
    var IN = Math.min(0.22, DUR * 0.12);

    transUpdate = function (t) {
      veil.style.opacity = String(1 - clamp01(IN > 0 ? t / IN : 1));
      var q = clamp01((t - (DUR - FLIP)) / FLIP);
      if (q <= 0) { svg.style.display = 'none'; return; }
      svg.style.display = '';
      var pr = smoothstep(q);
      // mép trên đi trước mép dưới → nếp gấp nghiêng như giấy thật
      var top = clamp01(pr / 0.78), bot = clamp01((pr - 0.22) / 0.78);
      var xT = W * (1 - top), xB = W * (1 - bot);
      // độ vồng của nếp: mạnh nhất giữa cú lật, phẳng lại ở hai đầu
      var curl = Math.sin(pr * Math.PI);
      var bow = W * 0.17 * curl, band = W * 0.02 + W * 0.17 * curl;
      // xuống: từ (xt,0) cong xuống (xb,H). lên: ngược lại, cho cạnh ngoài
      // của dải gấp — dùng lại hàm xuống rồi đảo là sai, điểm điều khiển phải
      // đổi thứ tự theo chiều đi thì đường mới song song với cạnh trong.
      function down(xt, xb, b) {
        return 'C ' + Math.min(W, xt + b) + ' ' + (H * 0.31).toFixed(1) + ' ' +
          Math.min(W, xb + b * 0.78) + ' ' + (H * 0.70).toFixed(1) + ' ' + xb.toFixed(1) + ' ' + H;
      }
      function up(xb, xt, b) {
        return 'C ' + Math.min(W, xb + b * 0.78) + ' ' + (H * 0.70).toFixed(1) + ' ' +
          Math.min(W, xt + b) + ' ' + (H * 0.31).toFixed(1) + ' ' + xt.toFixed(1) + ' 0';
      }
      var inner = 'M ' + xT.toFixed(1) + ' 0 ' + down(xT, xB, bow);
      behind.setAttribute('d', inner + ' H ' + W + ' V 0 Z');
      var oT = Math.min(W, xT + band), oB = Math.min(W, xB + band * 0.72);
      fold.setAttribute('d', inner + ' L ' + oB.toFixed(1) + ' ' + H + ' ' + up(oB, oT, bow * 0.8) + ' Z');
      edge.setAttribute('d', inner);
    };
  })();

  (function buildTransition() {
    if (TRANS !== 'fade' && TRANS !== 'dip') return;
    var v = el('div', null);
    v.style.cssText = 'position:fixed;inset:0;z-index:9;pointer-events:none;background:#000';
    document.body.appendChild(v);
    // dip: tối sâu và lâu hơn (kiểu chuyển đoạn); fade: chỉ chớm để mềm mối nối
    var d = TRANS === 'dip' ? 0.34 : 0.20;
    transUpdate = function (t) {
      var inOp = 1 - clamp01(t / d);                       // vào cảnh: đen → rõ
      var outOp = DUR > d ? clamp01((t - (DUR - d)) / d) : 0; // ra cảnh: rõ → đen
      v.style.opacity = Math.max(inOp, outOp);
    };
  })();

  /* Ken Burns đổi hướng theo số thứ tự cảnh. Mọi cảnh cùng trôi một hướng thì
     xem cả video thấy đơn điệu; đổi hướng luân phiên mà vẫn tất định để render
     lại ra đúng từng frame như cũ. */
  var PANS = [[0, -1], [0, 1], [-1, 0], [1, 0], [-0.7, -0.7], [0.7, -0.7]];
  function panOf() { return PANS[IDX % PANS.length]; }

  /* drift: ảnh nền trôi bao nhiêu px tại tiến độ p. Chưa bật chuyển động điện
     ảnh thì trả 0 — ảnh chỉ phóng như cũ, video cũ render lại không đổi. */
  function drift(p, amp) {
    if (MOTION !== 'cinematic') return [0, 0];
    var pan = panOf();
    return [(pan[0] * p * u * amp).toFixed(2), (pan[1] * p * u * amp).toFixed(2)];
  }

  var parallaxUpdate = null;
  (function buildParallax() {
    if (MOTION !== 'cinematic') return;
    var pan = panOf();
    // Lớp chữ trôi NGƯỢC lớp nền và biên độ nhỏ hơn — mắt đọc ra chiều sâu.
    parallaxUpdate = function (t) {
      var p = clamp01(DUR > 0 ? t / DUR : 0);
      stage.style.transform = 'translate(' + (-pan[0] * p * u * 0.9) + 'px,' +
        (-pan[1] * p * u * 0.9) + 'px)';
    };
  })();

  /* seek(t): đặt TOÀN BỘ trạng thái theo thời điểm t (không animation tự chạy) */
  window.seek = function (t) {
    if (!(t >= 0)) t = 0;
    bgUpdate(t);
    if (stockUpdate) stockUpdate(t);
    update(t);
    if (brandUpdate) brandUpdate(t);
    if (parallaxUpdate) parallaxUpdate(t);
    if (transUpdate) transUpdate(t);
  };
  window.seek(0);
})();
</script>
</body>
</html>
