<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }

/* Biến giao diện — mặc định BẰNG ĐÚNG giá trị hard-code cũ, Style Kit chỉ ghi
   đè khi có bộ style, nên video cũ render lại vẫn y hệt. Cỡ chữ là 3 mốc gốc,
   mọi cỡ chữ khác tính theo tỉ lệ với 3 mốc này để bố cục không đổi. */
:root {
  --font-head: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --size-title: calc(var(--u) * 9.2);
  --size-big: calc(var(--u) * 8.4);
  --size-body: calc(var(--u) * 3.6);
}
body {
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}
#bg { position: fixed; left: -20%; top: -20%; width: 140%; height: 140%; z-index: 0; }
.orb { position: absolute; left: 0; top: 0; border-radius: 50%; filter: blur(60px); }

/* ---------- tư liệu nền (chạy dưới lớp chữ) ---------- */
#stockbg { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
#stockimg {
  position: absolute; left: 50%; top: 50%; width: 100%; height: 100%;
  object-fit: cover; transform-origin: 50% 50%; will-change: transform;
}
#stockveil { position: absolute; inset: 0; }

/* ---------- logo + tên kênh ---------- */
#brand {
  position: fixed; left: 0; right: 0; bottom: 3.4%; z-index: 2;
  display: flex; align-items: center; gap: calc(var(--u) * 1.8);
  padding: 0 7.5%; pointer-events: none;
}
#brand.pos-left { justify-content: flex-start; }
#brand.pos-center { justify-content: center; }
#brand.pos-right { justify-content: flex-end; }
#brandlogo {
  height: calc(var(--u) * 5.4); width: auto; max-width: 34%;
  object-fit: contain;
  filter: drop-shadow(0 calc(var(--u) * .3) calc(var(--u) * 1) rgba(0,0,0,.35));
}
#brandname {
  font-family: var(--font-body); font-weight: 700;
  font-size: calc(var(--size-body) * 2.6 / 3.6); letter-spacing: .06em;
  color: var(--fg); white-space: nowrap;
  text-shadow: 0 calc(var(--u) * .2) calc(var(--u) * .9) rgba(0,0,0,.4);
}

#stage {
  position: fixed; inset: 0; z-index: 1; padding: 8%;
  display: flex; flex-direction: column; justify-content: center;
  color: var(--fg); overflow-wrap: break-word;
}

/* ---------- themes ---------- */
body.theme-vivid {
  --fg: #FFFFFF; --muted: rgba(255,255,255,.78);
  --t1: #FFFFFF; --t2: #FFE0F3;
  --a1: #FFD166; --a2: #FF8FAB;
  --track: rgba(255,255,255,.20);
  --codebg: rgba(16,10,40,.85); --codeline: rgba(255,255,255,.14);
  background: #7C3AED;
}
body.theme-vivid #bg {
  background: linear-gradient(135deg, #7C3AED 0%, #A855F7 38%, #EC4899 100%);
  background-size: 220% 220%;
}
body.theme-dark {
  --fg: #F4F1FF; --muted: #A9A3C4;
  --t1: #A78BFA; --t2: #F472B6;
  --a1: #A78BFA; --a2: #F472B6;
  --track: rgba(255,255,255,.10);
  --codebg: #171130; --codeline: rgba(255,255,255,.10);
  background: #0E0A1F;
}
body.theme-dark #bg { background: #0E0A1F; }
body.theme-light {
  --fg: #17123A; --muted: #5B5677;
  --t1: #7C3AED; --t2: #EC4899;
  --a1: #7C3AED; --a2: #EC4899;
  --track: rgba(23,18,58,.10);
  --codebg: #1B1533; --codeline: rgba(255,255,255,.10);
  background: #F7F5FE;
}
body.theme-light #bg { background: #F7F5FE; }

/* ---------- shared ---------- */
.grad-text {
  background: linear-gradient(92deg, var(--t1), var(--t2));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  /* Chữ gradient cắt mất phần trên của dấu chồng tầng tiếng Việt (Ẫ Ể Ấ Ữ Ổ)
     vì dấu vươn ra ngoài hộp tô gradient nên không được vẽ. Đo thực tế: mất
     17px ở cỡ chữ 150px. line-height 1.0 + padding-top .5em kéo hộp tô lên
     đủ để chứa dấu; padding-bottom giữ phần chân chữ (ạ ậ ợ) không bị hụt. */
  line-height: 1.0;
  padding-top: .5em;
  padding-bottom: .14em;
}
.center {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; height: 100%; gap: calc(var(--u)*2.6);
}
.top { display: flex; flex-direction: column; justify-content: center; height: 100%; }
.badge {
  display: inline-flex; align-items: center; gap: .45em;
  font-family: var(--font-head);
  font-size: calc(var(--size-body) * 2.4 / 3.6); font-weight: 800; letter-spacing: .18em;
  padding: calc(var(--u)*1) calc(var(--u)*2.8); border-radius: 999px;
  background: linear-gradient(92deg, var(--a1), var(--a2)); color: #fff;
  box-shadow: 0 calc(var(--u)*.8) calc(var(--u)*3) rgba(0,0,0,.22);
}
.sec-title {
  font-family: var(--font-head);
  font-size: calc(var(--size-title) * 6 / 9.2); font-weight: 800; letter-spacing: -.015em;
  line-height: 1.12; margin-bottom: calc(var(--u)*4.2);
}

/* ---------- hero ---------- */
.hero-title { font-family: var(--font-head); font-size: var(--size-title); font-weight: 800; line-height: 1.06; letter-spacing: -.02em; }
.hero-sub { font-size: var(--size-body); color: var(--muted); font-weight: 500; max-width: 92%; line-height: 1.4; }

/* ---------- bullets ---------- */
.bullet {
  display: flex; align-items: flex-start; gap: calc(var(--u)*2.2);
  font-size: calc(var(--size-body) * 3.7 / 3.6); font-weight: 600; line-height: 1.35;
  margin-bottom: calc(var(--u)*3);
}
.tick {
  flex: none; width: calc(var(--size-body) * 4.6 / 3.6); height: calc(var(--size-body) * 4.6 / 3.6); border-radius: 50%;
  background: linear-gradient(135deg, var(--a1), var(--a2));
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: calc(var(--size-body) * 2.5 / 3.6); font-weight: 800;
  box-shadow: 0 calc(var(--u)*.6) calc(var(--u)*2.2) rgba(0,0,0,.22);
}
.btext { padding-top: calc(var(--u)*.5); }

/* ---------- code ---------- */
.codewrap {
  background: var(--codebg); border: 1px solid var(--codeline);
  border-radius: calc(var(--u)*2.2); overflow: hidden;
  box-shadow: 0 calc(var(--u)*2) calc(var(--u)*6) rgba(0,0,0,.35);
}
.codebar { display: flex; gap: calc(var(--u)*1); padding: calc(var(--u)*1.6) calc(var(--u)*2); border-bottom: 1px solid var(--codeline); }
.dot { width: calc(var(--u)*1.3); height: calc(var(--u)*1.3); border-radius: 50%; }
.codebody {
  padding: calc(var(--u)*2.6); min-height: calc(var(--u)*18);
  font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  font-size: calc(var(--size-body) * 2.6 / 3.6); line-height: 1.65; color: #E9E5FF;
  white-space: pre-wrap; word-break: break-word;
}
.caret { color: var(--a2); font-weight: 400; }

/* ---------- chart ---------- */
.rows { display: flex; flex-direction: column; gap: calc(var(--u)*3); }
.rlabel {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: calc(var(--size-body) * 2.9 / 3.6); font-weight: 600; margin-bottom: calc(var(--u)*1);
}
.rval { font-family: var(--font-head); font-weight: 800; font-size: calc(var(--size-big) * 3.1 / 8.4); }
.track { height: calc(var(--u)*3); border-radius: 999px; background: var(--track); overflow: hidden; }
.bar { height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, var(--a1), var(--a2)); }

/* ---------- product ---------- */
.pwrap { display: flex; flex-direction: column; justify-content: center; height: 100%; }
.pimgwrap {
  flex: none; height: 58%; border-radius: calc(var(--u)*3); overflow: hidden;
  box-shadow: 0 calc(var(--u)*2.4) calc(var(--u)*7) rgba(0,0,0,.35);
  margin-bottom: calc(var(--u)*3.6);
}
.pimg { width: 100%; height: 100%; object-fit: cover; transform-origin: center; }
.ptitle { font-family: var(--font-head); font-size: calc(var(--size-title) * 6.2 / 9.2); font-weight: 800; letter-spacing: -.015em; line-height: 1.12; }
.pbig { font-size: var(--size-big); }
.psub { font-size: calc(var(--size-body) * 3.2 / 3.6); color: var(--muted); font-weight: 500; margin-top: calc(var(--u)*1.6); line-height: 1.4; }

/* ---------- photo (ảnh tràn khung, chữ đè 1/3 dưới) ---------- */
.phwrap { position: absolute; inset: 0; overflow: hidden; }
.phimg {
  position: absolute; left: 50%; top: 50%; width: 100%; height: 100%;
  object-fit: cover; transform-origin: 50% 50%; will-change: transform;
}
.phshade {
  position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(180deg, rgba(6,4,18,.46) 0%, rgba(6,4,18,.06) 22%, rgba(6,4,18,0) 38%,
                    rgba(6,4,18,.42) 62%, rgba(6,4,18,.80) 82%, rgba(6,4,18,.94) 100%);
}
.phtext {
  position: absolute; left: 7.5%; right: 7.5%; bottom: 13%;
  display: flex; flex-direction: column; align-items: flex-start;
}
.phbar {
  height: calc(var(--u)*.8); width: calc(var(--u)*11); border-radius: 999px;
  background: linear-gradient(92deg, var(--a1), var(--a2));
  margin-bottom: calc(var(--u)*2.6);
  box-shadow: 0 calc(var(--u)*.4) calc(var(--u)*1.6) rgba(0,0,0,.45);
}
.phtitle {
  font-family: var(--font-head);
  color: #fff; font-weight: 800; letter-spacing: -.012em; line-height: 1.26;
  overflow: hidden; overflow-wrap: break-word;
  text-shadow: 0 calc(var(--u)*.32) calc(var(--u)*1.5) rgba(0,0,0,.66),
               0 calc(var(--u)*.08) calc(var(--u)*.5) rgba(0,0,0,.55);
}

/* ---------- quote ---------- */
.qmark { font-family: Georgia, "Times New Roman", serif; font-size: calc(var(--size-big) * 24 / 8.4); line-height: .55; font-weight: 800; }
.qtext { font-family: var(--font-head); font-size: calc(var(--size-title) * 5.2 / 9.2); font-weight: 600; font-style: italic; line-height: 1.35; letter-spacing: -.01em; max-width: 94%; }
.qauthor { font-size: calc(var(--size-body) * 3 / 3.6); color: var(--muted); font-weight: 600; }

/* ---------- outro ---------- */
.pulse { position: relative; width: calc(var(--u)*16); height: calc(var(--u)*16); margin-bottom: calc(var(--u)*2); }
.ring { position: absolute; inset: 0; border-radius: 50%; border: calc(var(--u)*.5) solid var(--a2); }
.core {
  position: absolute; inset: 22%; border-radius: 50%;
  background: linear-gradient(135deg, var(--a1), var(--a2));
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: calc(var(--u)*4.4);
}
.otitle { font-family: var(--font-head); font-size: calc(var(--size-title) * 7.6 / 9.2); font-weight: 800; letter-spacing: -.02em; line-height: 1.1; max-width: 96%; }
.osub { font-size: calc(var(--size-body) * 3.4 / 3.6); color: var(--muted); font-weight: 600; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="stockbg" style="display:none"><img id="stockimg" alt=""><div id="stockveil"></div></div>
<div id="stage"></div>
<div id="brand" style="display:none"><img id="brandlogo" alt=""><span id="brandname"></span></div>
<script>
var DATA = {{.DataJSON}};
(function () {
  'use strict';
  var D = DATA, W = D.w, H = D.h, DUR = D.dur;
  var K = D.kit || null;
  var u = Math.min(W, H) / 100;
  document.documentElement.style.setProperty('--u', u + 'px');
  document.body.className = 'theme-' + D.theme;

  /* template hiệu lực: cảnh photo mà chưa có ảnh thì rơi về hero */
  var TPL = D.template === 'photo' && !D.image ? 'hero' : D.template;

  /* ---------- helpers: mọi trạng thái là hàm thuần của t ---------- */
  function clamp01(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }
  function easeOutCubic(x) { x = clamp01(x); return 1 - Math.pow(1 - x, 3); }
  function seg(t, start, dur) { return easeOutCubic((t - start) / dur); }
  function rnd(i) { var x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
  function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt !== undefined && txt !== null) e.textContent = txt;
    return e;
  }
  function fx(e, op, tx, ty, extra) {
    if (!e) return;
    e.style.opacity = op;
    e.style.transform = 'translate(' + tx + 'px,' + ty + 'px)' + (extra || '');
  }
  function fmtVal(v, allInt) {
    if (allInt) return Math.round(v).toLocaleString('vi-VN');
    return (Math.round(v * 10) / 10).toLocaleString('vi-VN', { maximumFractionDigits: 1 });
  }

  /* ---------- màu: đọc mã hex của bộ style ---------- */
  function hex2rgb(h) {
    if (typeof h !== 'string') return null;
    var s = h.trim().replace('#', '');
    if (s.length === 3) s = s[0] + s[0] + s[1] + s[1] + s[2] + s[2];
    if (!/^[0-9a-fA-F]{6}$/.test(s)) return null;
    return [parseInt(s.slice(0, 2), 16), parseInt(s.slice(2, 4), 16), parseInt(s.slice(4, 6), 16)];
  }
  function rgba(h, a) {
    var c = hex2rgb(h);
    return c ? 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')' : h;
  }
  function mix(h1, h2, k) {
    var a = hex2rgb(h1), b = hex2rgb(h2);
    if (!a || !b) return h1;
    return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * k) + ',' +
      Math.round(a[1] + (b[1] - a[1]) * k) + ',' +
      Math.round(a[2] + (b[2] - a[2]) * k) + ')';
  }

  /* ---------- bộ style: font, cỡ chữ, 3 biến màu ---------- */
  var ACC = (K && K.accent) || '', ACC2 = (K && K.accent2) || ACC;
  var TS = K && K.rTitle > 0 ? K.rTitle : 1;
  (function applyKit() {
    if (!K) return;
    var root = document.documentElement.style, b = document.body.style;
    if (K.fontHead) root.setProperty('--font-head', K.fontHead);
    if (K.fontBody) root.setProperty('--font-body', K.fontBody);
    root.setProperty('--size-title', (u * 9.2 * TS) + 'px');
    root.setProperty('--size-big', (u * 8.4 * (K.rBig > 0 ? K.rBig : 1)) + 'px');
    root.setProperty('--size-body', (u * 3.6 * (K.rBody > 0 ? K.rBody : 1)) + 'px');
    if (K.textMain) {
      b.setProperty('--fg', K.textMain);
      b.setProperty('--muted', rgba(K.textMain, .74));
      b.setProperty('--t1', K.textMain);
      b.setProperty('--track', rgba(K.textMain, .18));
      b.setProperty('--codeline', rgba(K.textMain, .16));
    }
    if (ACC) {
      b.setProperty('--a1', ACC);
      b.setProperty('--a2', ACC2);
      b.setProperty('--t2', ACC);
    }
    if (K.bgDeep) {
      b.background = K.bgDeep;
      b.setProperty('--codebg', mix(K.bgDeep, '#000000', .45));
    }
  })();

  /* accent riêng của cảnh vẫn thắng bộ style (override có chủ đích);
     không có bộ style thì giữ NGUYÊN cách xử lý cũ */
  if (D.accent) {
    document.body.style.setProperty('--a1', D.accent);
    if (K) {
      document.body.style.setProperty('--t2', D.accent);
    } else if (D.theme !== 'vivid') {
      document.body.style.setProperty('--t1', D.accent);
    }
  }

  /* ---------- nền: gradient + hạt glow trôi theo t ---------- */
  var bgEl = document.getElementById('bg');
  var orbs = [];
  (function buildBg() {
    var cols;
    if (K) {
      /* nền lấy từ bộ style: gradient màu nền chính → pha màu nhấn, hạt glow
         lấy từ bảng màu để cả khung hình cùng một tông */
      if (K.bgDeep) {
        bgEl.style.background = 'linear-gradient(135deg, ' + K.bgDeep + ' 0%, ' +
          mix(K.bgDeep, ACC || K.bgDeep, .34) + ' 100%)';
        bgEl.style.backgroundSize = '220% 220%';
      }
      cols = [];
      (K.palette || []).forEach(function (c) { if (hex2rgb(c)) cols.push(rgba(c, .40)); });
      if (!cols.length) cols = [rgba(ACC, .42), rgba(ACC2, .34), rgba(K.textMain, .12), rgba(ACC, .28)];
    } else if (D.theme === 'light') {
      cols = ['rgba(196,181,253,.75)', 'rgba(249,168,212,.70)', 'rgba(167,243,208,.50)', 'rgba(196,181,253,.60)'];
    } else if (D.theme === 'dark') {
      cols = ['rgba(124,58,237,.50)', 'rgba(236,72,153,.42)', 'rgba(59,130,246,.30)', 'rgba(124,58,237,.40)'];
    } else {
      cols = ['rgba(255,255,255,.55)', 'rgba(255,158,210,.60)', 'rgba(255,209,102,.50)', 'rgba(167,139,250,.55)'];
    }
    for (var i = 0; i < 4; i++) {
      var o = el('div', 'orb');
      var s = Math.min(W, H) * (0.38 + 0.16 * rnd(i));
      o.style.width = s + 'px';
      o.style.height = s + 'px';
      o.style.background = 'radial-gradient(circle at 40% 40%, ' + cols[i % cols.length] + ', transparent 70%)';
      bgEl.appendChild(o);
      orbs.push({
        e: o, s: s,
        bx: (0.06 + 0.85 * rnd(i + 7)) * W * 1.4,
        by: (0.06 + 0.85 * rnd(i + 13)) * H * 1.4,
        sp: 0.25 + 0.3 * rnd(i + 3),
        ph: rnd(i + 5) * 6.283,
        ax: W * 0.05, ay: H * 0.04
      });
    }
  })();
  function bgUpdate(t) {
    if (D.theme === 'vivid' || (K && K.bgDeep)) {
      bgEl.style.backgroundPosition =
        (20 + 14 * Math.sin(t * 0.35)) + '% ' + (50 + 14 * Math.cos(t * 0.27)) + '%';
    }
    for (var i = 0; i < orbs.length; i++) {
      var o = orbs[i];
      var x = o.bx + Math.sin(t * o.sp + o.ph) * o.ax - o.s / 2;
      var y = o.by + Math.cos(t * o.sp * 0.8 + o.ph) * o.ay - o.s / 2;
      o.e.style.transform = 'translate(' + x + 'px,' + y + 'px)';
    }
  }

  /* ---------- tư liệu nền: chỉ cho template KHÔNG có ảnh riêng ----------
     Dùng khung hình tĩnh (video đã được ffmpeg trích sẵn 1 khung đại diện) và
     zoom theo t — nhờ vậy nền vẫn tất định, mọi frame tính lại y hệt. */
  var stockOwn = { hero: 1, bullets: 1, quote: 1, outro: 1 };
  var stockUpdate = null;
  (function buildStock() {
    if (!D.stock || !stockOwn[TPL]) return;
    var wrap = document.getElementById('stockbg');
    var img = document.getElementById('stockimg');
    var veil = document.getElementById('stockveil');
    img.src = D.stock;
    var base = (K && K.bgDeep) || '#06040F';
    veil.style.background = 'linear-gradient(180deg, ' + rgba(base, .58) + ' 0%, ' +
      rgba(base, .70) + ' 45%, ' + rgba(base, .88) + ' 100%)';
    wrap.style.display = '';
    stockUpdate = function (t) {
      var p = clamp01(DUR > 0 ? t / DUR : 0);
      img.style.opacity = 0.55 + 0.45 * seg(t, 0, 0.7);
      img.style.transform = 'translate(-50%,-50%) scale(' + (1 + 0.05 * p) + ')';
    };
  })();

  /* ---------- logo + tên kênh ---------- */
  var brandUpdate = null;
  (function buildBrand() {
    if (!K) return;
    var name = K.channelName || '', logo = D.logo || '';
    if (!name && !logo) return;
    var wrap = document.getElementById('brand');
    var img = document.getElementById('brandlogo');
    var txt = document.getElementById('brandname');
    if (logo) { img.src = logo; } else { img.style.display = 'none'; }
    if (name) { txt.textContent = name; } else { txt.style.display = 'none'; }
    wrap.className = 'pos-' + (K.logoPos || 'left');
    wrap.style.display = '';
    brandUpdate = function (t) { wrap.style.opacity = 0.85 * seg(t, 0.25, 0.6); };
  })();

  /* ---------- template builders: trả về update(t) ---------- */
  var stage = document.getElementById('stage');

  function buildHero() {
    var c = el('div', 'center');
    var badge = el('div', 'badge', '✦');
    var title = el('h1', 'hero-title grad-text', D.title || '');
    var sub = D.subtitle ? el('p', 'hero-sub', D.subtitle) : null;
    c.appendChild(badge); c.appendChild(title);
    if (sub) c.appendChild(sub);
    stage.appendChild(c);
    return function (t) {
      var eb = seg(t, 0, 0.45); fx(badge, eb, 0, (1 - eb) * -24);
      var e1 = seg(t, 0, 0.8); fx(title, e1, 0, (1 - e1) * 60);
      var e2 = seg(t, 0.4, 0.8); fx(sub, e2, 0, (1 - e2) * 40);
    };
  }

  function buildBullets() {
    var c = el('div', 'top');
    var title = el('h2', 'sec-title grad-text', D.title || '');
    c.appendChild(title);
    var items = [];
    (D.bullets || []).forEach(function (txt) {
      var row = el('div', 'bullet');
      row.appendChild(el('div', 'tick', '✓'));
      row.appendChild(el('div', 'btext', txt));
      c.appendChild(row);
      items.push(row);
    });
    stage.appendChild(c);
    return function (t) {
      var e0 = seg(t, 0, 0.5); fx(title, e0, 0, (1 - e0) * 30);
      for (var i = 0; i < items.length; i++) {
        var e = seg(t, 0.45 + i * 0.35, 0.55);
        fx(items[i], e, (1 - e) * -46, 0);
      }
    };
  }

  function buildCode() {
    var c = el('div', 'top');
    var title = null;
    if (D.title) { title = el('h2', 'sec-title grad-text', D.title); c.appendChild(title); }
    var wrap = el('div', 'codewrap');
    var barEl = el('div', 'codebar');
    ['#FF5F57', '#FEBC2E', '#28C840'].forEach(function (col) {
      var d = el('span', 'dot'); d.style.background = col; barEl.appendChild(d);
    });
    var body = el('pre', 'codebody');
    var codeSpan = el('span', '', '');
    var caret = el('span', 'caret', '▍');
    body.appendChild(codeSpan); body.appendChild(caret);
    wrap.appendChild(barEl); wrap.appendChild(body);
    c.appendChild(wrap); stage.appendChild(c);
    var chars = D.code ? Array.from(D.code) : [];
    var typeStart = 0.35;
    var typeDur = Math.min(Math.max(DUR - 1.4, 0.8), Math.max(chars.length * 0.045, 0.8));
    return function (t) {
      if (title) { var e0 = seg(t, 0, 0.5); fx(title, e0, 0, (1 - e0) * 30); }
      var ew = seg(t, 0.1, 0.6); fx(wrap, ew, 0, (1 - ew) * 40);
      var n = Math.floor(clamp01((t - typeStart) / typeDur) * chars.length);
      codeSpan.textContent = chars.slice(0, n).join('');
      var blink = n < chars.length ? (Math.floor(t * 3) % 2 === 0) : (Math.floor(t * 1.4) % 2 === 0);
      caret.style.opacity = blink ? 1 : 0;
    };
  }

  function buildChart() {
    var c = el('div', 'top');
    var title = el('h2', 'sec-title grad-text', D.title || '');
    c.appendChild(title);
    var rowsEl = el('div', 'rows');
    var data = D.chart || [];
    var maxV = 0, allInt = true;
    data.forEach(function (it) {
      var v = Number(it.value) || 0;
      if (v > maxV) maxV = v;
      if (Math.abs(v - Math.round(v)) > 1e-9) allInt = false;
    });
    if (maxV <= 0) maxV = 1;
    var rows = [];
    data.forEach(function (it) {
      var row = el('div', 'row');
      var lab = el('div', 'rlabel');
      lab.appendChild(el('span', '', it.label || ''));
      var val = el('span', 'rval', '0');
      lab.appendChild(val);
      var track = el('div', 'track');
      var bar = el('div', 'bar');
      track.appendChild(bar);
      row.appendChild(lab); row.appendChild(track);
      rowsEl.appendChild(row);
      rows.push({ row: row, bar: bar, val: val, v: Number(it.value) || 0 });
    });
    c.appendChild(rowsEl); stage.appendChild(c);
    return function (t) {
      var e0 = seg(t, 0, 0.5); fx(title, e0, 0, (1 - e0) * 30);
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        var ein = seg(t, 0.2 + i * 0.22, 0.4); fx(r.row, ein, (1 - ein) * -30, 0);
        var e = seg(t, 0.35 + i * 0.22, 0.9);
        r.bar.style.width = (r.v / maxV * 100 * e) + '%';
        r.val.textContent = fmtVal(r.v * e, allInt);
      }
    };
  }

  function buildProduct() {
    var hasImg = !!D.image;
    var c = el('div', hasImg ? 'pwrap' : 'center');
    var iw = null, img = null;
    if (hasImg) {
      iw = el('div', 'pimgwrap');
      img = document.createElement('img');
      img.className = 'pimg';
      img.src = D.image;
      iw.appendChild(img);
      c.appendChild(iw);
    }
    var title = el('div', hasImg ? 'ptitle' : 'ptitle pbig grad-text', D.title || '');
    var sub = D.subtitle ? el('div', 'psub', D.subtitle) : null;
    c.appendChild(title);
    if (sub) c.appendChild(sub);
    stage.appendChild(c);
    return function (t) {
      if (iw) {
        iw.style.opacity = seg(t, 0, 0.6);
        img.style.transform = 'scale(' + (1 + 0.05 * clamp01(t / DUR)) + ')';
      }
      var e1 = seg(t, hasImg ? 0.25 : 0, 0.7); fx(title, e1, 0, (1 - e1) * 36);
      var e2 = seg(t, hasImg ? 0.5 : 0.4, 0.7); fx(sub, e2, 0, (1 - e2) * 30);
    };
  }

  /* photo: ảnh tràn khung, zoom rất nhẹ theo t, chữ trắng đè ở 1/3 dưới.
     Cỡ chữ tự co theo độ dài và bị chặn tối đa 3 dòng (đo một lần lúc dựng
     trang, không phụ thuộc t nên mọi frame đều nhất quán). */
  function buildPhoto() {
    if (!D.image) return buildHero(); // chưa có ảnh → vẫn ra cảnh tử tế
    var wrap = el('div', 'phwrap');
    var img = document.createElement('img');
    img.className = 'phimg';
    img.src = D.image;
    var shade = el('div', 'phshade');
    var box = el('div', 'phtext');
    var bar = el('div', 'phbar');
    var title = el('div', 'phtitle', D.title || '');
    box.appendChild(bar); box.appendChild(title);
    wrap.appendChild(img); wrap.appendChild(shade); wrap.appendChild(box);
    stage.appendChild(wrap);

    var lineH = 1.26, maxLines = 3;
    var boxW = W * 0.85;
    var n = Math.max((D.title || '').length, 1);
    // ước lượng bề rộng trung bình 1 ký tự ≈ 0.52 lần cỡ chữ → cỡ vừa 3 dòng
    var px = Math.max(Math.min(maxLines * boxW / (0.52 * n), u * 6.8 * TS), u * 3.2 * TS);
    title.style.fontSize = px + 'px';
    for (var g = 0; g < 14 && px > u * 2.6; g++) {
      if (title.getBoundingClientRect().height <= px * lineH * maxLines + 2) break;
      px *= 0.93;
      title.style.fontSize = px + 'px';
    }
    title.style.maxHeight = (px * lineH * maxLines) + 'px'; // chặn cứng 3 dòng

    return function (t) {
      var p = clamp01(DUR > 0 ? t / DUR : 0);
      var e0 = seg(t, 0, 0.5);
      img.style.opacity = 0.35 + 0.65 * e0;
      img.style.transform = 'translate(-50%,-50%) scale(' + (1 + 0.06 * p) + ') translateY(' + (-0.6 * p) + '%)';
      shade.style.opacity = 0.72 + 0.28 * e0;
      var e1 = seg(t, 0.22, 0.75); fx(box, e1, 0, (1 - e1) * 40);
      bar.style.transform = 'scaleX(' + (0.2 + 0.8 * seg(t, 0.32, 0.7)) + ')';
      bar.style.transformOrigin = 'left center';
    };
  }

  function buildQuote() {
    var c = el('div', 'center');
    var mark = el('div', 'qmark', '“');
    var txt = el('div', 'qtext', D.title || '');
    var author = D.subtitle ? el('div', 'qauthor', '— ' + D.subtitle) : null;
    c.appendChild(mark); c.appendChild(txt);
    if (author) c.appendChild(author);
    stage.appendChild(c);
    return function (t) {
      mark.style.opacity = 0.16 * seg(t, 0, 0.8);
      var e1 = seg(t, 0.15, 1.0);
      txt.style.opacity = e1;
      txt.style.transform = 'translateY(' + ((1 - e1) * 34) + 'px) rotate(-1.2deg)';
      var e2 = seg(t, 0.7, 0.8); fx(author, e2, 0, (1 - e2) * 20);
    };
  }

  function buildOutro() {
    var c = el('div', 'center');
    var pulse = el('div', 'pulse');
    var ring1 = el('div', 'ring');
    var ring2 = el('div', 'ring');
    var core = el('div', 'core', '▶');
    pulse.appendChild(ring1); pulse.appendChild(ring2); pulse.appendChild(core);
    var title = el('div', 'otitle grad-text', D.title || '');
    var sub = D.subtitle ? el('div', 'osub', D.subtitle) : null;
    c.appendChild(pulse); c.appendChild(title);
    if (sub) c.appendChild(sub);
    stage.appendChild(c);
    return function (t) {
      var w1 = Math.sin(t * Math.PI * 1.6);
      ring1.style.transform = 'scale(' + (1 + 0.10 * w1) + ')';
      ring1.style.opacity = 0.55 + 0.3 * w1;
      var w2 = Math.sin(t * Math.PI * 1.6 - 1.2);
      ring2.style.transform = 'scale(' + (1.18 + 0.14 * w2) + ')';
      ring2.style.opacity = 0.3 + 0.2 * w2;
      core.style.opacity = seg(t, 0, 0.6);
      var e1 = seg(t, 0.15, 0.7);
      title.style.opacity = e1;
      title.style.transform = 'translateY(' + ((1 - e1) * 40) + 'px) scale(' + (0.92 + 0.08 * e1) + ')';
      var e2 = seg(t, 0.5, 0.7); fx(sub, e2, 0, (1 - e2) * 26);
    };
  }

  var builders = {
    hero: buildHero, bullets: buildBullets, code: buildCode, chart: buildChart,
    product: buildProduct, photo: buildPhoto, quote: buildQuote, outro: buildOutro
  };
  var update = (builders[TPL] || buildHero)();

  /* seek(t): đặt TOÀN BỘ trạng thái theo thời điểm t (không animation tự chạy) */
  window.seek = function (t) {
    if (!(t >= 0)) t = 0;
    bgUpdate(t);
    if (stockUpdate) stockUpdate(t);
    update(t);
    if (brandUpdate) brandUpdate(t);
  };
  window.seek(0);
})();
</script>
</body>
</html>
